<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>editor widget</title>
    <!-- Load Calcite Design System -->
    <script type="module" src="https://js.arcgis.com/calcite-components/3.3.3/calcite.esm.js"></script>

    <!-- Load the JavaScript Maps SDK core API -->
    <script src="https://js.arcgis.com/4.34/"></script>

    <!-- Load the JavaScript Maps SDK Map components or other component packages -->
    <script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>
    <script type="module" src="main.js" defer></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <arcgis-map basemap="topo-vector" center='-5.984588, 37.384891' zoom='5'>
        <arcgis-editor slot="bottom-right"></arcgis-editor>
    </arcgis-map>
</body>

</html>
