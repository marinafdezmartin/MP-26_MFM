<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <script type="module" src="main.js" defer></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <arcgis-map basemap="topo-vector" center='-3.632130, 40.546347' zoom='9'>
        <arcgis-legend slot="bottom-right" legend-style="classic"></arcgis-legend>
    </arcgis-map>
</body>

</html>
