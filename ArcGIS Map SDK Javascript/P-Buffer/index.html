<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <script type="module" src="main.js" defer></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }
    </style>

</head>

<body class="calcite-mode-dark">
    <arcgis-map basemap='topo-vector' center="-5.985275, 37.382981" zoom="10">

        <arcgis-expand slot="bottom-right" icon-number="0" mode="floating" visual-scale="m" collapse-icon="pencil"
            expand-icon="pencil" expand-tooltip collapse-tooltip group>
            <arcgis-sketch creation-mode="continuous" layout="horizontal" hide-create-tools-circle
                hide-create-tools-multipoint hide-create-tools-polygon hide-create-tools-polyline
                hide-create-tools-rectangle hide-selection-tools-lasso-selection
                hide-selection-tools-rectangle-selection hide-settings-menu></arcgis-sketch>
        </arcgis-expand>

        <arcgis-scale-bar slot="bottom-left" bar-style="line" unit="metric"></arcgis-scale-bar>
    </arcgis-map>
</body>

</html>
