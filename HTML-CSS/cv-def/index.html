<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cv definitivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="topbar">
        <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#educacion">Educación</a>
        <a href="#experiencia">Experiencia</a>
        <a href="#software">Software</a>
        <a href="#contacto">Contacto</a>
        </nav>
    </div>

    <div class="layout">

        <div class="sidebar">
            <div class="sidebar-box">
                <!-- Nombre -->
                <div class="nombre">
                    <!-- <img width="30px" height="30px" src="./imagenes/moderno.png" alt="Icono perfil"> -->
                    <h2>Marina Fernández</h2>
                </div>

                <!-- Imagen perfil -->
                <div class="imagen-perfil">
                    <img id="perfil" width="250px" src="./imagenes/IMG_6459.jpg" alt="Imagen de perfil">
                </div>

                <!-- Descripción -->
                <div class="descripcion-columna">
                    <p>Ambientóloga</p>
                    <p>GIS</p>
                    <p>Desarrolladora GIS</p>
                </div>

                <!-- Fecha y lugar -->
                <div class="fecha-lugar">
                    <p>01/03/1999</p>
                    <p>Madrid, España</p>
                </div>

                <!-- Botones contacto -->
                <div class="botones">
                    <a href="mailto:marinafdez.martin@gmail.com" aria-label="Email">
                        <img src="./imagenes/icons8-correo-24.png" alt="">
                    </a>

                    <a href="tel:+34626388060" aria-label="Teléfono">
                        <img width="24px" src="./imagenes/icons8-teléfono-50.png" alt="">
                    </a>

                    <a
                        href="https://www.linkedin.com/in/marina-fernández-martín"
                        target="_blank"
                        aria-label="LinkedIn"
                    >
                        <img width="24px" src="./imagenes/icons8-linkedin-50.png" alt="">
                    </a>
                </div>

                <!-- Descargar CV -->
                <div class="descarga-cv">
                    <a href="./CV_Marina_Fernandez.pdf" download>Descargar CV</a>
                </div>
                
            </div>
        </div>
        <div class="main" id="main">
            <div class="section" id="inicio">INICIO</div>
            <div class="section" id="educacion">EDUCACIÓN</div>
            <div class="section" id="experiencia">EXPERIENCIA</div>
            <div class="section" id="software">SOFTWARE</div>
            <div class="section" id="contacto">CONTACTO</div>
        </div>

    </div>
    
</body>
</html>
