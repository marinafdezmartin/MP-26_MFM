<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../ej_Twitter/imagenes/icons8-twitter-48.png" type="image/x-icon">
</head>

<body>

    <div class="contenedor-principal">

        <div class="contenedor-superior">
            <div class="imagen">
                <img width="30px" height="30px"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlyEAs231ZjJhrSA5xJFUGJIYZG6Y6c0ivsg&s"
                    alt="foto de usuario">
            </div>
            <div class="usuario">
                <div>Mediamodifier</div>
                <div id="username">@mediamodifier</div>
            </div>
            <div class="boton">
                <button>
                    <img width="15px" height="15px" src="../ej_Twitter/imagenes/flecha-abajo.png" alt="">
                </button>
            </div>
        </div>

        <hr>

        <div class="contenedor-parrafo">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur earum culpa porro repellat sed? Vel a
                ducimus facilis. Officiis ut asperiores inventore sapiente odio commodi nisi necessitatibus placeat
                aperiam quod.</p>
            <p id="hora-fecha">5:03 PM · FEB 26, 2020</p>
        </div>

        <hr>

        <div class="contenedor-respuesta">
            <p>7.7K Retweets</p>
            <p>43K Likes</p>
        </div>

        <hr>

        <div class="contenedor-interaccion">
            <buttom>
                <img width="15px" height="15px" src="../ej_Twitter/imagenes/comentario.png" alt="">
            </buttom>
            <buttom>
                <img width="20px" height="20px" src="../ej_Twitter/imagenes/retweet.png" alt="">
            </buttom>
            <buttom>
                <img width="18px" height="18px" src="../ej_Twitter/imagenes/me-gusta.png" alt="">
            </buttom>
            <buttom>
                <img width="18px" height="18px" src="../ej_Twitter/imagenes/participacion.png" alt="">
            </buttom>
        </div>

    </div>

</body>

</html>
